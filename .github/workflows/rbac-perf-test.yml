name: RBAC Performance Test

on:
  workflow_dispatch:
    inputs:
      trials:
        description: 'Number of trials per run'
        default: '7'
      tree_height:
        description: 'Catalog tree height (9=~2.5K users, 11=~10K users)'
        default: '9'
      perf_repo_ref:
        description: 'backstage-rbac-performance branch/tag'
        default: 'work-on-performance-test'
  pull_request:
    paths:
      - 'workspaces/rbac/plugins/rbac-backend/**'
      - 'workspaces/rbac/plugins/rbac-node/**'
      - 'workspaces/rbac/plugins/rbac-common/**'

concurrency:
  group: rbac-perf-${{ github.ref }}
  cancel-in-progress: true

env:
  PERF_REPO: AndrienkoAleksandr/backstage-rbac-performance
  PERF_REF: ${{ github.event.inputs.perf_repo_ref || 'work-on-performance-test' }}
  TRIALS: ${{ github.event.inputs.trials || '7' }}
  TREE_HEIGHT: ${{ github.event.inputs.tree_height || '9' }}
  COMPOSE_DISABLE_LINUX: '1'
  CI: 'true'

jobs:
  perf-test:
    name: RBAC Performance Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout RBAC plugin (PR branch)
        uses: actions/checkout@v4
        with:
          path: community-plugins

      - name: Checkout perf harness
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PERF_REPO }}
          ref: ${{ env.PERF_REF }}
          token: ${{ secrets.PERF_REPO_PAT }}
          path: backstage-rbac-performance

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install aiohttp requests pyyaml

      - name: Generate catalog entities
        working-directory: backstage-rbac-performance/catalog-generator-scripts
        run: |
          ROOT_GROUPS=1 TREE_HEIGHT=${{ env.TREE_HEIGHT }} USER_LEVEL=0 NUM_USERS=5 ROLE_LEVEL=0 \
            python3 main.py
          # rbac-policy.csv is generated in org/ but app-config expects it in rbac/
          cp ../catalog-entities/org/rbac-policy.csv ../catalog-entities/rbac/rbac-policy.csv
          echo "Generated catalog:"
          grep -rc "kind: User" ../catalog-entities/ --include="*.yaml" | awk -F: '{sum+=$2} END {print "  Users:", sum}'
          grep -rc "kind: Group" ../catalog-entities/ --include="*.yaml" | awk -F: '{sum+=$2} END {print "  Groups:", sum}'
          echo "  RBAC policy: $(wc -l < ../catalog-entities/rbac/rbac-policy.csv) lines"

      - name: Build Backstage image
        working-directory: backstage-rbac-performance
        env:
          RBAC_WORKSPACE: ${{ github.workspace }}/community-plugins/workspaces/rbac
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: bash build-image.sh

      - name: Build test-runner image
        working-directory: backstage-rbac-performance
        run: docker build -f docker/Dockerfile.test-runner -t perf-test-runner:latest performance-scripts/

      - name: Start infrastructure (postgres + keycloak)
        working-directory: backstage-rbac-performance
        run: |
          docker compose -f docker-compose.yaml -f docker-compose.ci.yml up -d postgres keycloak
          echo "Waiting for postgres and keycloak to be healthy..."
          for i in $(seq 1 60); do
            PG=$(docker inspect --format='{{.State.Health.Status}}' postgres 2>/dev/null || echo "starting")
            KC=$(docker inspect --format='{{.State.Health.Status}}' keycloak 2>/dev/null || echo "starting")
            echo "  postgres=$PG keycloak=$KC"
            if [[ "$PG" == "healthy" && "$KC" == "healthy" ]]; then
              echo "Infrastructure ready."
              break
            fi
            sleep 5
          done
          docker inspect --format='{{.State.Health.Status}}' postgres | grep -q healthy
          docker inspect --format='{{.State.Health.Status}}' keycloak | grep -q healthy

      - name: Ingest catalog entities
        working-directory: backstage-rbac-performance
        run: bash scripts/init-catalog.sh --timeout 600

      - name: Debug catalog ingestion
        if: failure()
        working-directory: backstage-rbac-performance
        run: |
          echo "=== Backstage logs (last 100 lines) ==="
          docker compose -f docker-compose.yaml -f docker-compose.ci.yml logs backstage --tail 100
          echo "=== Container env ==="
          docker compose -f docker-compose.yaml -f docker-compose.ci.yml exec -T backstage \
            env | grep -i CATALOG || echo "no CATALOG vars in container"
          echo "=== Postgres databases ==="
          docker compose -f docker-compose.yaml -f docker-compose.ci.yml exec -T postgres \
            psql -U postgres -c "SELECT datname FROM pg_database;" 2>/dev/null
          echo "=== Catalog tables ==="
          docker compose -f docker-compose.yaml -f docker-compose.ci.yml exec -T postgres \
            psql -U postgres -d backstage_plugin_catalog -c "\dt" 2>/dev/null || echo "catalog db not found"

      - name: Run stability check
        working-directory: backstage-rbac-performance
        run: |
          chmod -R a+w performance-scripts/data/
          docker compose -f docker-compose.yaml -f docker-compose.ci.yml restart backstage
          timeout 60s bash -c 'until docker compose -f docker-compose.yaml -f docker-compose.ci.yml ps backstage | grep -q healthy; do sleep 3; done'
          ./run-perf-test.sh --mode benchmark \
            --trials ${{ env.TRIALS }} --skip-first-trial 2>&1 | tee stability-output.txt

      - name: Save baseline
        if: success()
        working-directory: backstage-rbac-performance
        run: |
          docker compose -f docker-compose.yaml -f docker-compose.ci.yml restart backstage
          timeout 60s bash -c 'until docker compose -f docker-compose.yaml -f docker-compose.ci.yml ps backstage | grep -q healthy; do sleep 3; done'
          ./run-perf-test.sh --mode benchmark \
            --trials ${{ env.TRIALS }} --skip-first-trial \
            --save-baseline baseline.json 2>&1 | tee baseline-output.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ github.sha }}
          path: |
            backstage-rbac-performance/performance-scripts/data/gated6/
            backstage-rbac-performance/performance-scripts/data/thresholds.json
            backstage-rbac-performance/stability-output.txt
            backstage-rbac-performance/baseline-output.txt
          retention-days: 30

      - name: Print summary
        if: always()
        working-directory: backstage-rbac-performance
        run: |
          echo "## RBAC Performance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Trials | ${{ env.TRIALS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tree height | ${{ env.TREE_HEIGHT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Runner | \`ubuntu-latest\` (4 vCPU) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f stability-output.txt ]; then
            echo "### Stability" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A20 "ENVIRONMENT STABILITY" stability-output.txt | head -25 >> $GITHUB_STEP_SUMMARY || true
            grep "VERDICT" stability-output.txt >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f baseline-output.txt ]; then
            echo "### Baseline" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep "VERDICT" baseline-output.txt >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup
        if: always()
        working-directory: backstage-rbac-performance
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yml down -v --remove-orphans 2>/dev/null || true
