# Same layout as rbac-perf-test.yml, for the roles5 user set
# (4 users, 5 Casbin roles each). Results and thresholds live in data/roles5/,
# separate from roles1. Harness ref must include catalog-entities/roles5/
# and the role5_* Keycloak users.
name: RBAC Performance Test (roles5)

on:
  workflow_dispatch:
    inputs:
      trials:
        description: 'Number of trials per run'
        default: '7'
      tree_height:
        description: 'Catalog tree height (9=~2.5K users, 11=~10K users)'
        default: '9'
      perf_repo_ref:
        description: 'backstage-rbac-performance branch/tag (must include roles5 fixtures)'
        default: 'split/performance-test'
  pull_request:
    paths:
      - 'workspaces/rbac/plugins/rbac-backend/**'
      - 'workspaces/rbac/plugins/rbac-node/**'
      - 'workspaces/rbac/plugins/rbac-common/**'

concurrency:
  group: rbac-perf-roles5-${{ github.ref }}
  cancel-in-progress: true

env:
  PERF_REPO: AndrienkoAleksandr/backstage-rbac-performance
  PERF_REF: ${{ github.event.inputs.perf_repo_ref || 'split/performance-test' }}
  TRIALS: ${{ github.event.inputs.trials || '7' }}
  TREE_HEIGHT: ${{ github.event.inputs.tree_height || '9' }}
  COMPOSE_DISABLE_LINUX: '1'
  CI: 'true'

jobs:
  perf-test-roles5:
    name: RBAC Performance Benchmark (roles5)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout RBAC plugin (PR branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: community-plugins

      - name: Checkout perf harness
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PERF_REPO }}
          ref: ${{ env.PERF_REF }}
          token: ${{ secrets.PERF_REPO_PAT }}
          path: backstage-rbac-performance

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        working-directory: backstage-rbac-performance
        run: pip install -r performance-scripts/requirements.txt

      - name: Generate catalog entities
        working-directory: backstage-rbac-performance/catalog-generator-scripts
        run: |
          ROOT_GROUPS=1 TREE_HEIGHT=${{ env.TREE_HEIGHT }} USER_LEVEL=0 NUM_USERS=5 ROLE_LEVEL=0 \
            python3 main.py
          echo "Generated catalog:"
          grep -rc "kind: User" ../catalog-entities/ --include="*.yaml" | awk -F: '{sum+=$2} END {print "  Users:", sum}'
          grep -rc "kind: Group" ../catalog-entities/ --include="*.yaml" | awk -F: '{sum+=$2} END {print "  Groups:", sum}'
          echo "  RBAC policy: $(wc -l < ../catalog-entities/rbac/rbac-policy.csv) lines"
          echo "  Org policy: $(wc -l < ../catalog-entities/org/rbac-policy.csv) lines"
          test -f ../catalog-entities/roles5/users.yaml
          test -f ../catalog-entities/roles5/rbac-policy.csv
          echo "  roles5 users: $(grep -c 'kind: User' ../catalog-entities/roles5/users.yaml)"

      - name: Build test-runner image
        working-directory: backstage-rbac-performance
        run: docker build -f docker/Dockerfile.test-runner -t perf-test-runner:latest performance-scripts/

      - name: Determine base ref
        id: base-ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "label=base (${{ github.event.pull_request.base.ref }})" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD" >> "$GITHUB_OUTPUT"
            echo "label=current" >> "$GITHUB_OUTPUT"
          fi

      # Both images are built before any measurement so yarn does not run
      # between baseline and compare. The noise study runs later, on this VM,
      # and its thresholds apply only to the compare in this job.
      - name: Build Backstage images
        working-directory: backstage-rbac-performance
        env:
          RBAC_WORKSPACE: ${{ github.workspace }}/community-plugins/workspaces/rbac
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: |
          set -euo pipefail
          plugin="${{ github.workspace }}/community-plugins"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git -C "$plugin" checkout ${{ steps.base-ref.outputs.ref }} -- workspaces/rbac/ yarn.lock
            echo "Building baseline from ${{ steps.base-ref.outputs.ref }}"
            IMAGE_NAME=backstage-rbac-perf:baseline bash build-image.sh
            git -C "$plugin" checkout ${{ github.sha }} -- workspaces/rbac/ yarn.lock
            echo "Building patch from ${{ github.sha }}"
            IMAGE_NAME=backstage-rbac-perf:patch bash build-image.sh
            docker tag backstage-rbac-perf:baseline backstage-rbac-perf:latest
          else
            bash build-image.sh
          fi
          docker image inspect backstage-rbac-perf:latest >/dev/null

      - name: Ingest catalog entities
        working-directory: backstage-rbac-performance
        run: bash scripts/init-catalog.sh --timeout 600

      - name: Calibrate thresholds on this runner
        working-directory: backstage-rbac-performance
        run: |
          set -euo pipefail
          chmod -R a+w performance-scripts/data/
          WARMUP_MIN_SECONDS=60 WARMUP_MAX_SECONDS=60 \
            ./run-perf-test.sh --users roles5 \
            --trials ${{ env.TRIALS }} --skip-trials 1 \
            --noise-study --sessions 3 2>&1 | tee noise-study-output.txt

      - name: Save baseline
        working-directory: backstage-rbac-performance
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yaml -f docker-compose.ci.yml restart backstage
          timeout 300s bash -c 'until docker compose -f docker-compose.yaml -f docker-compose.ci.yml ps backstage | grep -q healthy; do sleep 3; done'
          WARMUP_MIN_SECONDS=60 WARMUP_MAX_SECONDS=60 \
            ./run-perf-test.sh --users roles5 \
            --trials ${{ env.TRIALS }} --skip-trials 1 \
            --save-baseline baseline.json 2>&1 | tee baseline-output.txt

      - name: Run patch trials and compare
        if: github.event_name == 'pull_request'
        working-directory: backstage-rbac-performance
        run: |
          set -euo pipefail
          docker tag backstage-rbac-perf:patch backstage-rbac-perf:latest
          docker compose -f docker-compose.yaml -f docker-compose.ci.yml up -d --force-recreate --no-deps backstage
          timeout 300s bash -c 'until docker compose -f docker-compose.yaml -f docker-compose.ci.yml ps backstage | grep -q healthy; do sleep 3; done'
          WARMUP_MIN_SECONDS=60 WARMUP_MAX_SECONDS=60 \
            ./run-perf-test.sh --users roles5 \
            --trials ${{ env.TRIALS }} --skip-trials 1 \
            --compare baseline.json 2>&1 | tee compare-output.txt

      - name: Debug on failure
        if: failure()
        working-directory: backstage-rbac-performance
        run: |
          echo "=== Backstage logs (last 80 lines) ==="
          docker compose -f docker-compose.yaml -f docker-compose.ci.yml logs backstage --tail 80
          echo "=== Container env ==="
          docker compose -f docker-compose.yaml -f docker-compose.ci.yml exec -T backstage \
            env | grep -i CATALOG || echo "no CATALOG vars"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-roles5-${{ github.sha }}
          if-no-files-found: warn
          path: |
            backstage-rbac-performance/performance-scripts/data/roles5/
            backstage-rbac-performance/noise-study-output.txt
            backstage-rbac-performance/baseline-output.txt
            backstage-rbac-performance/compare-output.txt
          retention-days: 30

      - name: Print summary
        if: always()
        working-directory: backstage-rbac-performance
        run: |
          echo "## RBAC Performance Test Results (roles5)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Trials | ${{ env.TRIALS }} (first dropped) |" >> $GITHUB_STEP_SUMMARY
          echo "| User set | roles5 |" >> $GITHUB_STEP_SUMMARY
          echo "| Warm-up | 60s |" >> $GITHUB_STEP_SUMMARY
          echo "| Noise study | 3 sessions on this VM |" >> $GITHUB_STEP_SUMMARY
          echo "| Tree height | ${{ env.TREE_HEIGHT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Harness | ${{ env.PERF_REF }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Event | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Runner | \`ubuntu-latest\` (4 vCPU) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f noise-study-output.txt ]; then
            echo "### Thresholds for this runner" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A20 "Per-gate thresholds" noise-study-output.txt | head -24 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f baseline-output.txt ]; then
            echo "### Baseline (${{ steps.base-ref.outputs.label }})" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A15 "CI gates" baseline-output.txt | head -20 >> $GITHUB_STEP_SUMMARY || true
            grep "VERDICT" baseline-output.txt >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f compare-output.txt ]; then
            echo "### Regression (patch vs baseline)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A20 "Cohort regression" compare-output.txt | head -24 >> $GITHUB_STEP_SUMMARY || true
            grep "VERDICT" compare-output.txt >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup
        if: always()
        working-directory: backstage-rbac-performance
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yml down -v --remove-orphans 2>/dev/null || true
